name: Keep HF Space awake

# Pings the Hugging Face Space backend on a schedule so it never goes idle
# and the first request from the Vercel frontend doesn't hit a cold start.
on:
  schedule:
    # Every 30 minutes (GitHub may delay scheduled runs by a few minutes under load)
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping backend /health
        env:
          BACKEND_URL: https://archeese04-docsy-backend.hf.space
        run: |
          # A sleeping Space can take a few minutes to boot, so retry with backoff.
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -s -o /tmp/body.txt -w "%{http_code}" --max-time 120 "$BACKEND_URL/health" || echo "000")
            echo "Attempt $attempt: HTTP $code — $(cat /tmp/body.txt 2>/dev/null | head -c 200)"
            # Any real HTTP answer below 500 means the container is up and serving.
            # (While the Space is booting, HF returns 503 or the request times out.)
            if [ "$code" != "000" ] && [ "$code" -lt 500 ]; then
              exit 0
            fi
            sleep $((attempt * 20))
          done
          echo "Backend did not come up after retries"
          exit 1
