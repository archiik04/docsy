services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: docsy_postgres

    environment:
      POSTGRES_USER: docsy_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: docsy_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    command: >
      postgres
      -c shared_buffers=256MB
      -c work_mem=16MB
      -c random_page_cost=1.1
      -c maintenance_work_mem=256MB
      -c max_parallel_workers=4

  redis:
    image: redis:7-alpine
    container_name: docsy_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

volumes:
  postgres_data:
  redis_data: